{{define "version_status.html"}}
<span id="version-status" class="muted">
  {{- if .Update.Available}}
  <a href="{{.Update.URL}}" target="_blank" rel="noopener noreferrer" class="badge update">Update available: {{.Update.Latest}}</a>
  {{- else if .Update.Checked}}
  up to date
  {{- else}}
  update check unavailable
  {{- end}}
</span>
{{end}}
