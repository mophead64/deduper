name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  release:
    name: Containerise & release
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Serialised so two pushes landing close together can't compute the same
    # "next tag for today" and race each other.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write   # create the vYYYY.MM.DD tag + GitHub release
      packages: write   # push the image to GHCR
    env:
      IMAGE: ghcr.io/mophead64/deduper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release tag
        id: tag
        run: |
          date="$(date -u +%Y.%m.%d)"
          base="v${date}"
          if ! git rev-parse -q --verify "refs/tags/${base}" >/dev/null; then
            tag="$base"
          else
            n=1
            while git rev-parse -q --verify "refs/tags/${base}.${n}" >/dev/null; do
              n=$((n + 1))
            done
            tag="${base}.${n}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} (image tag ${tag#v})"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${{ steps.tag.outputs.tag }}" \
            -f target_commitish="${{ github.sha }}" \
            --jq .body > body.md
          {
            echo
            echo "Pull this version: \`docker pull ${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }}\`"
          } >> body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --notes-file body.md
